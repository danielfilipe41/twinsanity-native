name: runtime data

# The check needs the retail disc: its executable's bytes are what the runtime build loads, and the split's objects are
# what those bytes are compared against. The disc is not in the repository, so the job runs on a runner that has one and
# reads its path from the repository variable TWINSANITY_DISC (default: disc, the working directory's copy).
#
# Run it from the Actions tab, not from a push. It waits on a self-hosted runner that a push to GitHub cannot be sure of --
# a checkout without one sits queued -- so waking it to every change of configure.py only left a run that never finished.
on:
  workflow_dispatch:
    inputs:
      disc:
        description: "Path to the disc folder or image on the runner"
        required: false
        default: disc

jobs:
  parity:
    # A runner that has the retail disc (or its image) and the split's asm: the split is generated from the disc, so a
    # hosted runner has neither half of the comparison
    runs-on: [self-hosted, twinsanity-data]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build both ways and compare the loaded data
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_runtime_data.py "${{ inputs.disc || vars.TWINSANITY_DISC || 'disc' }}"
